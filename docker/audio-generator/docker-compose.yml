services:
  # Main orchestrator service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio-orchestrator:latest
    container_name: agent-adventures-audio-orchestrator
    environment:
      - PYTHONUNBUFFERED=1
      # Agent Adventures WebSocket connection
      - AGENT_ADVENTURES_WS_URL=ws://localhost:3001/ws/audio
      # Channel service URLs (use localhost since orchestrator uses host network)
      - NARRATION_SERVICE_URL=http://localhost:8081
      - COMMENTARY_SERVICE_URL=http://localhost:8082
      - AMBIENT_SERVICE_URL=http://localhost:8083
      - MUSIC_SERVICE_URL=http://localhost:8084
    volumes:
      # Volume map source code for live editing
      - ./src:/app
      # Configuration files
      - ./config:/config
    ports:
      # HTTP API for control/monitoring
      - "8080:8080"
      # SRT audio output channels (to OBS)
      - "9001:9001/udp"  # Narration
      - "9002:9002/udp"  # Ambient
      - "9003:9003/udp"  # Music
      - "9004:9004/udp"  # Commentary
    network_mode: host
    restart: unless-stopped
    depends_on:
      - narration
      - commentary
      - ambient
      - music

  # Narration TTS Service (Chatterbox)
  narration:
    build:
      context: ./narration
      dockerfile: Dockerfile
    image: audio-narration:latest
    container_name: agent-adventures-audio-narration
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    volumes:
      # Live code editing
      - ./narration/src:/app
      # Model cache
      - ./cache/narration:/root/.cache
      # Shared Kokoro models (writable for PyTorch model downloads)
      - ./models/kokoro:/root/.local/share/kokoro
    ports:
      - "8081:8081"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Commentary TTS Service (Chatterbox)
  commentary:
    build:
      context: ./commentary
      dockerfile: Dockerfile
    image: audio-commentary:latest
    container_name: agent-adventures-audio-commentary
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    volumes:
      # Live code editing
      - ./commentary/src:/app
      # Model cache
      - ./cache/commentary:/root/.cache
      # Shared Kokoro models (writable for PyTorch model downloads)
      - ./models/kokoro:/root/.local/share/kokoro
    ports:
      - "8082:8082"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ambient Audio Service (Procedural)
  ambient:
    build:
      context: ./ambient
      dockerfile: Dockerfile
    image: audio-ambient:latest
    container_name: agent-adventures-audio-ambient
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Live code editing
      - ./ambient/src:/app
      # Ambient sample libraries
      - ./assets/ambient:/app/assets/ambient:ro
    ports:
      - "8083:8083"
    restart: unless-stopped

  # Music Generation Service (MusicGen)
  music:
    build:
      context: ./music
      dockerfile: Dockerfile
    image: audio-music:latest
    container_name: agent-adventures-audio-music
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    volumes:
      # Live code editing
      - ./music/src:/app
      # Model cache for MusicGen
      - ./cache/music:/root/.cache
    ports:
      - "8084:8084"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
