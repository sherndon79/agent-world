version: '3.8'

services:
  stream-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: stream-bridge:latest
    container_name: stream-bridge
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONUNBUFFERED=1
      - GST_DEBUG=2
    volumes:
      # Volume map source code for live editing
      - ./src:/app
      # Optional: Volume map for persistent config/data
      - ./config:/config
    ports:
      # HTTP API
      - "8080:8080"
      # SRT input ports (video + audio channels)
      - "9000-9010:9000-9010/udp"
      # SRT monitoring output
      - "9998:9998/udp"
    restart: unless-stopped