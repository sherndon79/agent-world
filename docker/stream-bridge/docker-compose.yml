version: '3.8'

services:
  stream-bridge:
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    container_name: stream-bridge
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONUNBUFFERED=1
      - GST_DEBUG=2
    volumes:
      # Volume map source code for live editing
      - ./src:/app
      # Optional: Volume map for persistent config/data
      - ./config:/config
    ports:
      # HTTP API
      - "8080:8080"
      # SRT input ports (video + audio channels)
      - "9000-9010:9000-9010/udp"
      # SRT monitoring output
      - "9998:9998/udp"
    working_dir: /app
    command: >
      bash -c "
      apt-get update && apt-get install -y
      gstreamer1.0-tools
      gstreamer1.0-plugins-base
      gstreamer1.0-plugins-good
      gstreamer1.0-plugins-bad
      gstreamer1.0-plugins-ugly
      gstreamer1.0-libav
      python3
      python3-pip
      python3-gi
      python3-gst-1.0
      libgstreamer1.0-dev
      gir1.2-gstreamer-1.0
      curl
      && pip3 install flask requests
      && python3 main.py
      "
    restart: unless-stopped